<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>House Price Predictor</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 40px auto;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: 600;
      }
      input,
      select {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 18px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #result {
        margin-top: 20px;
        font-size: 1.1em;
      }
      #result.error {
        color: #b00020;
      }
      #result.success {
        color: #1a7f37;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>House Price Predictor</h1>

    <form id="predict-form">
      <label for="area">Area (m²)</label>
      <input type="number" id="area" name="area" required />

      <label for="bedrooms">Bedrooms</label>
      <input type="number" id="bedrooms" name="bedrooms" step="1" required />

      <label for="location">Location</label>
      <select id="location" name="location">
        <option value="hanoi">Hanoi</option>
        <option value="hcmc">HCMC</option>
        <option value="other">Other</option>
      </select>

      <button type="submit">Predict price</button>
    </form>

    <div id="result"></div>

    <script>
      const form = document.getElementById("predict-form");
      const resultDiv = document.getElementById("result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const area = document.getElementById("area").value;
        const bedrooms = document.getElementById("bedrooms").value;
        const location = document.getElementById("location").value;

        resultDiv.className = "";
        resultDiv.textContent = "Predicting...";

        const url = `/predict?area=${encodeURIComponent(area)}&bedrooms=${encodeURIComponent(bedrooms)}&location=${encodeURIComponent(location)}`;

        try {
          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(`Server responded with status ${response.status}`);
          }

          const data = await response.json();

          const formatted = new Intl.NumberFormat("en-US").format(
            data.predicted_price,
          );
          resultDiv.className = "success";
          resultDiv.textContent = `Predicted price: ${formatted} VND`;
        } catch (err) {
          resultDiv.className = "error";
          resultDiv.textContent = `Something went wrong: ${err.message}`;
        }
      });
    </script>
  </body>
</html>
